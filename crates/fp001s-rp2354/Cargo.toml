[package]
name = "alc-fp001s-rp2354"
version = "0.1.0"
edition = "2021"
description = "FP001S 顔・手のひら静脈端末 (RP2354A、ippoan/vein-base の pcb/fp001s_test_board t3) のファーム"
publish = false

# Not a member of the ESP workspace at the repo root (different target and toolchain): its own workspace.
[workspace]

[dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-rp = { version = "0.10", features = ["unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-usb = "0.6"
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-sync = "0.8"
embedded-io-async = "0.7"
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7"
panic-halt = "1"
static_cell = "2"
portable-atomic = { version = "1.5", features = ["critical-section"] }
heapless = "0.9"
# the same as alc-hub-core (alarm_key): no alloc here
ed25519-dalek = { version = "2", default-features = false }

[profile.release]
debug = 2
lto = true
opt-level = "s"
