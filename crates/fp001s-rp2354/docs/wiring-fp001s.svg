<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
<rect width="980" height="500" fill="#fff"/>
<text x="24" y="40" font-size="24" font-weight="bold">FP001S ⇔ Pico 2</text>
<text x="24" y="68" font-size="14" fill="#444">色は FP001S の付属ケーブル(コネクタの端から)。GND は緑。3.3V は AMS1117-3.3 から(Pico の 3V3 では足りない)。</text>
<rect x="24" y="110" width="150" height="350" rx="8" fill="#1b7a3a"/>
<rect x="77.0" y="98" width="44" height="22" rx="4" fill="#bbb"/>
<text x="99.0" y="114" font-size="11" text-anchor="middle">USB</text>
<text x="99.0" y="285.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">Pico 2</text>
<text x="99.0" y="303.0" font-size="11" fill="#cfe" text-anchor="middle">上から見た図</text>
<circle cx="36" cy="136" r="6" fill="#f5c518" stroke="#7a5c00"/>
<text x="46" y="140" font-size="11" fill="#fff" text-anchor="start" font-weight="bold">1</text>
<circle cx="162" cy="136" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="152" r="6" fill="#f5c518" stroke="#7a5c00"/>
<text x="46" y="156" font-size="11" fill="#fff" text-anchor="start" font-weight="bold">2</text>
<circle cx="162" cy="152" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="168" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="168" r="6" fill="#f5c518" stroke="#7a5c00"/>
<text x="152" y="172" font-size="11" fill="#fff" text-anchor="end" font-weight="bold">38</text>
<circle cx="36" cy="184" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="184" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="200" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="200" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="216" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="216" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="232" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="232" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="248" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="248" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="264" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="264" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="280" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="280" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="296" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="296" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="312" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="312" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="328" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="328" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="344" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="344" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="360" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="360" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="376" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="376" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="392" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="392" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="408" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="408" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="424" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="424" r="4" fill="#8fb" stroke="none"/>
<circle cx="36" cy="440" r="4" fill="#8fb" stroke="none"/>
<circle cx="162" cy="440" r="4" fill="#8fb" stroke="none"/>
<text x="230" y="96" font-size="14" font-weight="bold">FP001S(6 ピン)</text>
<text x="640" y="96" font-size="14" font-weight="bold">つなぐ先</text>
<rect x="230" y="110" width="170" height="32" rx="6" fill="#222"/>
<text x="242" y="131" font-size="15" fill="#fff">1  赤 3.3V</text>
<line x1="400" y1="126" x2="620" y2="126" stroke="#d32f2f" stroke-width="6" stroke-linecap="round"/>
<circle cx="628" cy="126" r="7" fill="#ddd" stroke="#888"/>
<text x="642" y="131" font-size="15">AMS1117-3.3 の出力(入力は USB-C 変換基板の 5V)</text>
<rect x="230" y="154" width="170" height="32" rx="6" fill="#222"/>
<text x="242" y="175" font-size="15" fill="#fff">2  黒 TXD(出力)</text>
<line x1="400" y1="170" x2="620" y2="170" stroke="#222" stroke-width="6" stroke-linecap="round"/>
<circle cx="628" cy="170" r="7" fill="#f5c518" stroke="#7a5c00"/>
<text x="642" y="175" font-size="15">Pico 2 番  GP1 = UART0 RX</text>
<rect x="230" y="198" width="170" height="32" rx="6" fill="#222"/>
<text x="242" y="219" font-size="15" fill="#fff">3  黄 RXD(入力)</text>
<line x1="400" y1="214" x2="620" y2="214" stroke="#fbc02d" stroke-width="6" stroke-linecap="round"/>
<circle cx="628" cy="214" r="7" fill="#f5c518" stroke="#7a5c00"/>
<text x="642" y="219" font-size="15">Pico 1 番  GP0 = UART0 TX</text>
<rect x="230" y="242" width="170" height="32" rx="6" fill="#222"/>
<text x="242" y="263" font-size="15" fill="#fff">4  緑 GND</text>
<line x1="400" y1="258" x2="620" y2="258" stroke="#43a047" stroke-width="6" stroke-linecap="round"/>
<circle cx="628" cy="258" r="7" fill="#f5c518" stroke="#7a5c00"/>
<text x="642" y="263" font-size="15">Pico 38 番  GND(AMS1117 の GND とも共通)</text>
<rect x="230" y="286" width="170" height="32" rx="6" fill="#222"/>
<text x="242" y="307" font-size="15" fill="#fff">5  青 D−</text>
<line x1="400" y1="302" x2="620" y2="302" stroke="#1e88e5" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6"/>
<circle cx="628" cy="302" r="7" fill="#ddd" stroke="#888"/>
<text x="642" y="307" font-size="15">USB-C 変換基板の D−(カメラ)</text>
<rect x="230" y="330" width="170" height="32" rx="6" fill="#222"/>
<text x="242" y="351" font-size="15" fill="#fff">6  白 D+</text>
<line x1="400" y1="346" x2="620" y2="346" stroke="#9e9e9e" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6"/>
<circle cx="628" cy="346" r="7" fill="#ddd" stroke="#888"/>
<text x="642" y="351" font-size="15">USB-C 変換基板の D+(カメラ)</text>
<text x="230" y="408" font-size="14" fill="#333">・USB-C 変換基板は A 口の充電器 + A→C から(PC の USB だと顔の処理で再起動)</text>
<text x="230" y="430" font-size="14" fill="#333">・GND は FP001S・AMS1117・Pico 2 を全部共通に(忘れると UART が 0V)</text>
<text x="230" y="452" font-size="14" fill="#333">・人感センサー(IRQ)は FP001S には無い</text>
</svg>