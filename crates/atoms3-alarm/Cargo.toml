# 点呼端末の警告デバイス (issue #135、設計 plan/standing-devices.md §4)。
#
# ルートの alc-hub-cores3 と同一ワークスペースの別バイナリ。esp-idf-sys は
# 既定で「ワークスペースの root package (= ルートの alc-hub-cores3)」の
# metadata から sdkconfig 等を読むため、本 crate をビルドするときは
# `ESP_IDF_SYS_ROOT_CRATE=alc-hub-atoms3-alarm` を指定して本 crate の
# metadata (下記) を使わせること。**付け忘れると CoreS3 の sdkconfig
# (16MB flash / QUAD PSRAM / LCD) でビルドが走り、この機では動かない
# バイナリが黙って出来上がる。**
[package]
name = "alc-hub-atoms3-alarm"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "点呼端末の警告デバイス — キオスクの heartbeat が途切れたら自分の判断で鳴る据置ブザー"

[[bin]]
name = "alc-hub-atoms3-alarm"
harness = false

[dependencies]
alc-hub-common = { path = "../hub-common" }
# 鳴動判定 (alarm.rs) は hub-core の純粋ロジック。**この crate に判定を書かない**
alc-hub-core = { path = "../hub-core" }
# speaker = 警告音 (ES8311) / nfc = Unit NFC の読み取り (Refs ippoan/alc-app#387)。
# 運行管理者が席でカードをかざすと `EVT NFC_LOGIN` を USB へ出す (**打刻ではない**)。
# Unit NFC は**付いていれば読む**任意の部品で、無い機体も同じファームで動く
# (main.rs の「Unit NFC」節)。nfc を付けたぶん components/ の C++
# (M5Unit-NFC + nfc_shim) と legacy I2C 衝突回避の sdkconfig を抱える
alc-hub-drivers = { path = "../hub-drivers", features = ["nfc", "speaker"] }
anyhow = "1"
log = "0.4"
esp-idf-svc = { version = "0.52", default-features = false, features = [
    "native",
    "std",
    "alloc",
    "binstart",
] }

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
# 相対パスはワークスペースルート基準で解決される (esp-idf-sys の仕様)
esp_idf_sdkconfig_defaults = "crates/atoms3-alarm/sdkconfig.defaults"

# hub-drivers の ws_uplink (esp-idf-svc ws::client) に必要な managed component。
# **本機は uplink を使わない** (ネットワークを持たない) が、alc-hub-drivers は
# 1 クレートなので ws_uplink もリンク対象に入る (atoms3-nfc と同じ理由)。
# ルート (cores3) / atoms3-timecard / atoms3-nfc の宣言と同一バージョンに
# 揃えること (components_esp32s3.lock 共有)
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = "^1.5" }

# NFC: components/ 配下に vendor した M5Unit-NFC 系4ライブラリ + nfc_shim。
# パスは crate 相対 (atoms3-timecard と同じ書き方 — ルートの "components" とは違う)
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["../../components"]
