# NFC タイムカード端末 (issue #134、本番機 Atom VoiceS3R への移行は #151、
# 設計 plan/standing-devices.md §3)。
#
# ルートの alc-hub-cores3 と同一ワークスペースの別バイナリ。esp-idf-sys は
# 既定で「ワークスペースの root package (= ルートの alc-hub-cores3)」の
# metadata から sdkconfig 等を読むため、本 crate をビルドするときは
# `ESP_IDF_SYS_ROOT_CRATE=alc-hub-atoms3-timecard` を指定して本 crate の
# metadata (下記) を使わせること (atoms3-print と同じ理由)。
[package]
name = "alc-hub-atoms3-timecard"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "NFC タイムカード端末 — カードをかざすと kind=timecard の打刻イベントを WS uplink へ積む"

[[bin]]
name = "alc-hub-atoms3-timecard"
harness = false

[dependencies]
alc-hub-common = { path = "../hub-common" }
alc-hub-core = { path = "../hub-core" }
# nfc feature のみ。音 (ES8311) は本番機移行 (#151) と分けて別 issue で足す。
# **RMT は使わない** — Atom VoiceS3R に RGB LED が無く led.rs を #151 で削除した
# ため、WS2812 用の esp-idf-hal 直接依存 (rmt-legacy) も一緒に落としている
alc-hub-drivers = { path = "../hub-drivers", features = ["nfc"] }
anyhow = "1"
log = "0.4"
esp-idf-svc = { version = "0.52", default-features = false, features = [
    "native",
    "std",
    "alloc",
    "binstart",
] }

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
# 相対パスはワークスペースルート基準で解決される (esp-idf-sys の仕様)
esp_idf_sdkconfig_defaults = "crates/atoms3-timecard/sdkconfig.defaults"

# hub-drivers の ws_uplink (esp-idf-svc ws::client) に必要な managed component。
# ルート (cores3) の宣言と同一バージョンに揃えること (components_esp32s3.lock 共有)
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = "^1.5" }

# NFC: components/ 配下に vendor した M5Unit-NFC 系4ライブラリ + nfc_shim。
# パスは crate 相対 (atoms3-nfc と同じ書き方 — ルートの "components" とは違う)
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["../../components"]
