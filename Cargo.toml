[workspace]
members = [
    "crates/atoms3-nfc",
    "crates/atoms3-print",
    "crates/atoms3-timecard",
    "crates/hub-ble",
    "crates/hub-board",
    "crates/hub-common",
    "crates/hub-core",
    "crates/hub-drivers",
    "crates/hub-ui",
    "crates/hub-wifi",
]

[package]
name = "alc-hub-cores3"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.77"
description = "M5Stack CoreS3 統合ハブ ファームウェア (画面処理) — alc-app 点呼キオスク向け"

[[bin]]
name = "alc-hub-cores3"
harness = false

[features]
default = ["lan", "nfc-verify"]
# 開発用メモリ HUD (ステータスバーに RAM/PSRAM 使用率、hub-ui に伝搬)。
# 本番ビルドには入れない。有効化: cargo build --release --features mem-hud
# (local/flash.ps1 が付与する)
mem-hud = ["alc-hub-ui/mem-hud"]
# NFC (Unit NFC / ST25R3916, issue #84 + plan/nfc-card-identity.md)。
# components/nfc_shim 経由の C++ FFI を使う。
#
# **既定 on にした (本番昇格)**: dev(mem-hud) チャネル限定のままだと、本番
# `-app.bin` に永久に入らず、NFC を使う実機は /device/setup で dev ビルドを
# 「強制」インストールし直す運用になる (版が同じで「更新」が出ない)。免許証
# タップからの点呼開始 (#121) は運用上必須なので本番へ載せる。
# 「NFC を積むと内部RAM が ws_uplink の TLS ゲート (60KB) を割って WS が繋がらない」
# 問題は #111 で解決済み (実機で空き 40979 → 74627 bytes)。
nfc-verify = ["alc-hub-drivers/nfc", "alc-hub-drivers/speaker"]
# Base LAN PoE v1.2 (W5500)。CS=G9 / RST=G7 で内蔵スピーカー (I2S DOUT=G13) とは
# 競合しないため、旧 LAN Module 13.2 のような排他制約は無い (Refs #111)。
#
# **既定 on にした**: off のままだと CI の firmware ビルド (本番 `-app.bin` /
# dev `-dev-app.bin` とも feature 未指定) に LAN が入らず、**OTA で更新するたびに
# 実機の LAN が消える**。実際それでネットワークごと失い (`STATUS LAN=0`)、WS も
# 繋がらず OTA では復旧できないため USB 書き込みが必要になった。
# Base を積まない構成では `--no-default-features` で外す。
lan = []
# 次期構成 CoreS3 SE + Base LAN PoE v1.2 のピンマップ (plan/cores3-hub-consolidation.md
# 「次期構成」)。RS232M のジャンパを TX=G10 / RX=G6 へ移し、空いた Port C (G17/G18)
# を Unit NFC に使う。**実機のジャンパ位置とセットで切り替える** (ずれると FC-1200 と
# NFC が同じピンを取り合う)。板種別 (SE か否か) は feature ではなく起動時の I2C
# probe で判定する (STATUS BOARD=) ので、SE 本体に現行配線のまま載せるなら不要。
# CI は PR の check で `cargo check --features cores3-se,nfc-verify` を通す (実機未検証)
cores3-se = []

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
alc-hub-ble = { path = "crates/hub-ble" }
alc-hub-board = { path = "crates/hub-board" }
alc-hub-common = { path = "crates/hub-common" }
# ボード種別判定 (board::BoardKind::from_probe) を main の配線で呼ぶため
alc-hub-core = { path = "crates/hub-core" }
alc-hub-drivers = { path = "crates/hub-drivers" }
alc-hub-ui = { path = "crates/hub-ui" }
alc-hub-wifi = { path = "crates/hub-wifi" }
anyhow = "1"
log = "0.4"
# ble-medical-gateway firmware-rust (esp32-nimble 0.12) とバージョンを揃える
esp-idf-svc = { version = "0.52", default-features = false, features = [
    "native",
    "std",
    "alloc",
    "binstart",
] }

[build-dependencies]
embuild = "0.33"

# WS 送信 (#21): ESP-IDF の managed component (esp_websocket_client) を追加する。
# esp-idf-svc の ws::client はこの component が有効な場合のみコンパイルされる
# (cfg: esp_idf_comp_espressif__esp_websocket_client_enabled)
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_websocket_client", version = "^1.5" }

# NFC 検証 (nfc-verify feature): components/ 配下に vendor した M5Unit-NFC 系4ライブラリ +
# 自作シム (nfc_shim) をローカル ESP-IDF component として取り込む。ESP Component Registry
# には未登録のため (相互 git 依存で解決する形態)、手動 vendor 方式を取る
# (components/VENDOR.md に取得元コミット記録)。component 自体は feature 非依存で
# 常時ビルド・リンクされる (呼ばれない dead code として prod にも同梱される点に注意)
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components"]
